[tox]
# Only Django versions still under upstream support. Django 6.0 dropped
# Python 3.10 and 3.11.
envlist = py{310,311,312,313}-dj52
          py{312,313}-dj{60,61}
skipsdist = True

[testenv]
commands = {posargs:./manage.py test tests}
deps =
  dj52: Django==5.2.*
  dj60: Django==6.0.*
  # 6.1 is still a beta; no trove classifier for it yet.
  dj61: Django==6.1b1

  # only imported when DATABASE_URL is set
  dj-database-url

  # database drivers for the containers in docker-compose.yml
  psycopg[binary]
  mysqlclient
  oracledb

setenv =
    PYTHONPATH={toxinidir}
    PYTHONDONTWRITEBYTECODE=1

passenv =
    DJANGO_SETTINGS_MODULE
    DATABASE_URL


[testenv:integration]
# The query tests need a backend with first-class JSONField support; on sqlite
# they are skipped. Start the containers first: `make db-up`.
allowlist_externals=env
commands =
    env DATABASE_URL=postgres://jsonstore:jsonstore@127.0.0.1:5432/jsonstore ./manage.py test tests
    env DATABASE_URL=mysql://jsonstore:jsonstore@127.0.0.1:3306/jsonstore ./manage.py test tests
    env DATABASE_URL=mysql://jsonstore:jsonstore@127.0.0.1:3307/jsonstore ./manage.py test tests

[flake8]
max-line-length = 88
extend-ignore = E203, W503
